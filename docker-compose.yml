docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: orbit-db
    environment:
      POSTGRES_USER: vpnuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: vpnbot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/backup:/backup
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vpnuser -d vpnbot']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orbit-network
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: orbit-api
    ports:
      - '8000:8000'
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/app:/app/app
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - orbit-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/docs']
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: orbit-bot
    env_file: .env
    depends_on:
      - api
    volumes:
      - ./bot/app:/app/app
    networks:
      - orbit-network
    restart: unless-stopped

  mini-app:
    build:
      context: ./mini-app
      dockerfile: Dockerfile
    container_name: orbit-mini-app
    ports:
      - '3000:80'
    depends_on:
      - api
    networks:
      - orbit-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: orbit-scheduler
    env_file: .env
    depends_on:
      - db
      - api
    volumes:
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    networks:
      - orbit-network
    restart: unless-stopped

networks:
  orbit-network:
    driver: bridge

volumes:
  pgdata:
    driver: local

Makefile
