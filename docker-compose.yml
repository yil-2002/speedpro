### `docs/DEPLOYMENT.md`
```markdown
# 🚀 DEPLOYMENT GUIDE - PRODUCTION

## Server Tayyorlash (Hetzner CX23)

### 1. SSH Ulanish
```bash
ssh root@YOUR_SERVER_IP

2. System Yangilash
apt update && apt upgrade -y
apt install -y curl wget git nano htop

3. Docker O'rnatish
curl -fsSL https://get.docker.com -o get-docker.sh
sh get-docker.sh

# Docker'ni sozlash
systemctl enable docker
systemctl start docker

4. Docker Compose O'rnatish
curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
chmod +x /usr/local/bin/docker-compose
docker-compose --version

5. Nginx O'rnatish
apt install -y nginx certbot python3-certbot-nginx

systemctl enable nginx
systemctl start nginx

6. SSL Sertifikat
certbot --nginx -d your-domain.com

# Auto-renew
certbot renew --dry-run

7. Repository Klonlash
cd /opt
git clone https://github.com/YOUR_USERNAME/orbit-vpn.git
cd orbit-vpn

# Production .env
cp .env.example .env
nano .env

8. Docker Ishga Tushirish
docker-compose -f docker-compose.yml up -d

# Status tekshirish
docker-compose ps

# Loglarni ko'rish
docker-compose logs -f api

9. Database Migration
docker-compose exec api alembic upgrade head

10. Nginx Sozlash
cat > /etc/nginx/sites-available/orbit-vpn << 'EOF'
upstream api {
    server localhost:8000;
}

upstream mini_app {
    server localhost:3000;
}

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # API
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mini App
    location / {
        proxy_pass http://mini_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
EOF

ln -s /etc/nginx/sites-available/orbit-vpn /etc/nginx/sites-enabled/
nginx -t
systemctl restart nginx

Cron Jobs Sozlash
# Crontab o'chirish
crontab -e

# Quyidagi qatorlarni qo'shish:

# Trafikni har soatda sinxronizasiya
0 * * * * cd /opt/orbit-vpn && docker-compose exec -T api python scripts/traffic_sync.py

# Tugagan subscription'larni har kuni 00:00'da o'chirish
0 0 * * * cd /opt/orbit-vpn && docker-compose exec -T api python scripts/check_expiry.py

# Speed test har 6 soatda
0 */6 * * * cd /opt/orbit-vpn && docker-compose exec -T api python scripts/speed_test.py

# Database backup har kuni 01:00'da
0 1 * * * cd /opt/orbit-vpn && bash scripts/backup_db.sh

Monitoring
Logs Tekshirish
cd /opt/orbit-vpn

# API loglar
docker-compose logs -f api

# Bot loglar
docker-compose logs -f bot

# Database loglar
docker-compose logs -f db

Health Check
# API status
curl https://your-domain.com/api/v1/health

# Mini App
curl https://your-domain.com/

# Database
docker-compose exec db pg_isready -U vpnuser -d vpnbot

Backup va Recovery
Database Backup
docker-compose exec db pg_dump -U vpnuser -d vpnbot > backup.sql

Database Restore
docker-compose exec -T db psql -U vpnuser -d vpnbot < backup.sql

Volume Backup
